<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Índice</title>
  <style>
    :root {
      --bg-grad: linear-gradient(180deg, #0ea5e9 0%, #6366f1 100%);
      --card-bg: rgba(255, 255, 255, 0.14);
      --card-border: rgba(255, 255, 255, 0.25);
      --text: #ffffff;
      --hover: rgba(255, 255, 255, 0.24);
      --accent: #a5b4fc;
    }
    * { box-sizing: border-box; }
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; margin: 0; padding: 14px; color: var(--text); background: var(--bg-grad); }
    header { font-weight: 800; margin-bottom: 12px; color: var(--text); letter-spacing: 0.4px; }
    .brand { font-size: 14px; opacity: 0.9; margin-bottom: 8px; }
    nav a { display: block; padding: 10px 12px; color: var(--text); text-decoration: none; border-radius: 10px; margin-bottom: 8px; background: var(--card-bg); border: 1px solid var(--card-border); backdrop-filter: blur(6px); transition: background .2s ease, transform .15s ease; }
    nav a:hover { background: var(--hover); transform: translateX(2px); }
    nav a span { opacity: 0.85; }
    footer { margin-top: 12px; font-size: 12px; opacity: 0.85; }
  </style>
</head>
